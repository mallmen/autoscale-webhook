apiVersion: v1
kind: Namespace
metadata:
  name: autoscale-node-automation
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-readiness-watcher-sa
  namespace: autoscale-node-automation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-readiness-watcher-role
rules:
  # Permission to watch Node state cluster-wide
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Permission to create and manage onboarding Jobs in autoscale-node-automation
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-readiness-watcher-binding
subjects:
  - kind: ServiceAccount
    name: node-readiness-watcher-sa
    namespace: autoscale-node-automation
roleRef:
  kind: ClusterRole
  name: node-readiness-watcher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-node-management-sa
  namespace: autoscale-node-automation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aap-node-management-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["machine.openshift.io"]
    resources: ["machines"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aap-node-management-binding
subjects:
  - kind: ServiceAccount
    name: aap-node-management-sa
    namespace: autoscale-node-automation
roleRef:
  kind: ClusterRole
  name: aap-node-management-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: aap-node-management-token
  namespace: autoscale-node-automation
  annotations:
    kubernetes.io/service-account.name: aap-node-management-sa
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: aap-secret
  namespace: autoscale-node-automation
type: Opaque
stringData:
  token: "<AAP_AUTH_TOKEN>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-readiness-watcher
  namespace: autoscale-node-automation
  labels:
    app: node-readiness-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-readiness-watcher
  template:
    metadata:
      labels:
        app: node-readiness-watcher
    spec:
      serviceAccountName: node-readiness-watcher-sa
      containers:
        - name: watcher
          image: registry.access.redhat.com/ubi9/python-312:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --quiet kubernetes
              python -u /app/watcher.py
          env:
            - name: WATCHER_NAMESPACE
              value: "autoscale-node-automation"
            - name: AAP_HOST
              value: "aap.ipa.mikea.net"
            - name: WORKFLOW_ID
              value: "38"
            - name: AAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aap-secret
                  key: token
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: node-readiness-watcher-script
